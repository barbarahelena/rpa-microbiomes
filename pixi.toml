[workspace]
authors = ["Barbara Verhaar <barbaraverhaar@MacBook-Pro-van-Barbara.local>"]
channels = ["conda-forge", "bioconda"]
name = "rpa-microbiomes"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
install-bioc-data = "R -e \"BiocManager::install('GenomeInfoDbData', ask=FALSE, update=FALSE)\""
install-decontam = "R -e \"BiocManager::install('decontam', ask=FALSE, update=FALSE)\""
install-maaslin2 = "R -e \"BiocManager::install('Maaslin2', ask=FALSE, update=FALSE)\""
clean-helius = { cmd = "Rscript scripts/1a_datacleaning_helius.R", description = "Clean HELIUS clinical/metadata" }
clean-biome = { cmd = "Rscript scripts/1b_datacleaning_biome.R", depends-on = ["clean-helius"], description = "Clean and filter 16S and shotgun microbiome data into phyloseq objects" }
tableone = { cmd = "Rscript scripts/2_tableone.R", depends-on = ["clean-biome"], description = "Table 1: cohort characteristics" }
airpollution-participants = { cmd = "Rscript scripts/3_airpollution_participants.R", depends-on = ["clean-helius"], description = "Air pollution exposure distribution among HELIUS participants" }
airpollution-amsterdam = { cmd = "Rscript scripts/4_airpollution_amsterdam.R", description = "Amsterdam-wide PC6 air pollution map" }
relabund-plots = { cmd = "Rscript scripts/5_relative_abundance_plots.R", depends-on = ["clean-biome"], description = "Compositional (stacked bar) plots of taxon relative abundance" }
alpha-16s = { cmd = "Rscript scripts/6_alpha_diversity_16s_ethnicity.R", depends-on = ["clean-biome"], description = "Alpha diversity, 16S throat/nose, stratified by ethnicity" }
beta-16s-compute = { cmd = "Rscript scripts/7a_beta_diversity_16s_compute.R", depends-on = ["clean-biome"], description = "Beta diversity, 16S throat/nose: PERMANOVA/betadisper computation (permutation-heavy, cached)" }
beta-16s-report = { cmd = "Rscript scripts/7b_beta_diversity_16s_report.R", description = "Beta diversity, 16S throat/nose: rebuild plots/tables from cached PERMANOVA/betadisper results" }
beta-16s = { cmd = "Rscript scripts/7b_beta_diversity_16s_report.R", depends-on = ["beta-16s-compute"], description = "Beta diversity, 16S throat/nose, stratified by ethnicity (PERMANOVA, betadisper) - full compute + report" }
beta-16s-migration = { cmd = "Rscript scripts/8_beta_diversity_16s_migration.R", depends-on = ["clean-biome"], description = "Beta diversity, 16S, non-Dutch groups pooled by migration/acculturation" }
diffabund-16s = { cmd = "Rscript scripts/9_differential_abundance_16s.R", depends-on = ["clean-biome"], description = "Differential abundance, 16S throat/nose, pairwise ethnicity comparisons (MaAsLin2)" }
upset-diffabund-16s = { cmd = "Rscript scripts/10_upset_diffabund_16s.R", depends-on = ["diffabund-16s"], description = "Overlap of significant differentially abundant taxa across ethnicity pairs" }
alpha-shotgun = { cmd = "Rscript scripts/11_alpha_diversity_shotgun.R", depends-on = ["clean-biome"], description = "Alpha diversity, shotgun tongue/throat, stratified by ethnicity" }
pipeline = { depends-on = ["tableone", "airpollution-participants", "airpollution-amsterdam", "relabund-plots", "alpha-16s", "beta-16s", "beta-16s-migration", "upset-diffabund-16s", "alpha-shotgun"], description = "Run the full analysis pipeline end to end" }

[dependencies]
bioconductor-phyloseq = { version = ">=1.50.0,<2", channel = "bioconda" }
r-tidyverse = ">=2.0.0,<3"
r-ggplot2 = ">=4.0.1,<5"
r-haven = ">=2.5.5,<3"
r = ">=4.4,<4.5"
r-base = ">=4.4.3,<4.5"
r-biocmanager = ">=1.30.27,<2"
r-rio = ">=1.2.4,<2"
r-ggpubr = ">=0.6.2,<0.7"
r-vegan = ">=2.7_2,<3"
r-ggthemes = ">=5.2.0,<6"
r-tableone = ">=0.13.2,<0.14"
r-circlize = ">=0.4.17,<0.5"
r-here = ">=1.0.1,<2"
bioconductor-edger = ">=3.28.0"
r-vroom = ">=1.7.1,<2"
r-upsetr = ">=1.4.1,<2"
r-sf = ">=1.0_19,<2"
r-leaflet = ">=2.2.2,<3"
r-htmlwidgets = ">=1.6.4,<2"
